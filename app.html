<title>Thiago's Pokéwereld</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: one screen at a time (home, game, catch, pokédex), big touch targets sized for an iPad held by a 5-year-old. Single bright look on purpose. */
:root {
  --sky: #dff0ff;
  --sky-deep: #b9dcfb;
  --paper: #ffffff;
  --ink: #1b2a4a;
  --ink-soft: #5a6b8c;
  --red: #e3350d;
  --yellow: #ffcb05;
  --blue: #2a75bb;
  --green: #3fae5a;
  --grass: #8fd16a;
  --shadow: rgba(27, 42, 74, .18);
  --ui: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --read: "Andika", "Comic Sans MS", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  background: linear-gradient(var(--sky) 0 72%, var(--grass) 72% 100%) fixed;
  background-color: var(--sky);
  color: var(--ink);
  font-family: var(--ui);
  -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
  overflow-x: hidden;
}
.screen {
  min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 24px;
  display: flex; flex-direction: column; gap: 16px;
  max-width: 1100px; margin: 0 auto;
}
button { font: inherit; color: inherit; border: 0; cursor: pointer; }
button:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; }

/* ---------- home ---------- */
.hello { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.hello img { width: 84px; height: 84px; }
.hello h1 { margin: 0; font-size: clamp(32px, 6vw, 56px); line-height: 1; font-weight: 800; letter-spacing: -.5px; text-wrap: balance; }
.hello h1 span { color: var(--red); }
.hello .spacer { flex: 1; }
.chip {
  background: var(--paper); border-radius: 999px; padding: 10px 18px;
  font-weight: 700; font-size: 20px; display: inline-flex; align-items: center; gap: 8px;
  box-shadow: 0 4px 0 var(--shadow);
}
.chip:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
.tile {
  background: var(--paper); border-radius: 28px; padding: 18px 18px 14px;
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left;
  box-shadow: 0 8px 0 var(--shadow); min-height: 200px; padding-right: 150px; position: relative; overflow: hidden;
}
.tile:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--shadow); }
.tile .art { font-family: var(--read); font-weight: 700; font-size: 64px; line-height: 1.1; color: var(--blue); }
.tile h2 { margin: auto 0 0; font-size: 34px; line-height: 1; }
.tile p { margin: 0; color: var(--ink-soft); font-size: 18px; line-height: 1.2; }
.tile img.peek { position: absolute; right: 4px; bottom: 6px; width: 140px; }
.mission { background: var(--paper); border-radius: 999px; padding: 10px 20px; font-size: 19px; box-shadow: 0 4px 0 var(--shadow); align-self: flex-start; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mdots { display: inline-flex; gap: 6px; }
.mdots i { width: 18px; height: 18px; border-radius: 50%; background: #dbe3f0; display: block; }
.mdots i.on { background: var(--green); }
.tile .lvl { display: inline-flex; align-items: center; gap: 8px; }
.tile .done { background: var(--green); color: #fff; border-radius: 50%; width: 30px; height: 30px; display: grid; place-items: center; font-size: 18px; }
.chip .ball { width: 28px; height: 28px; }
@media (max-width: 420px) { .tile { padding-right: 110px; } .tile img.peek { width: 100px; } }
.tile .lvl { position: absolute; top: 14px; right: 16px; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: #dbe3f0; display: block; }
.dots i.on { background: var(--yellow); box-shadow: inset 0 0 0 2px #e0a800; }
.parent { color: var(--ink-soft); font-size: 15px; line-height: 1.3; max-width: 65ch; }

/* ---------- game ---------- */
.bar { display: flex; align-items: center; gap: 10px; }
.round { width: 64px; height: 64px; border-radius: 50%; background: var(--paper); font-size: 30px; display: grid; place-items: center; box-shadow: 0 4px 0 var(--shadow); flex: none; }
.round:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }
.stars { flex: 1; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.stars .ball { width: clamp(26px, 4.4vw, 40px); height: clamp(26px, 4.4vw, 40px); opacity: .25; transition: opacity .3s, transform .3s; }
.stars .ball.on { opacity: 1; transform: scale(1.15) rotate(-12deg); }
.lvlbtn { background: var(--paper); border-radius: 999px; padding: 8px 14px; box-shadow: 0 4px 0 var(--shadow); font-weight: 700; font-size: 16px; display: inline-flex; gap: 8px; align-items: center; }
.question {
  font-size: clamp(26px, 4.4vw, 40px); font-weight: 800; text-align: center; line-height: 1.15; margin: 0;
  display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; text-wrap: balance;
}
.question .say { width: 52px; height: 52px; font-size: 24px; }
.stage {
  background: var(--paper); border-radius: 32px; padding: 20px; min-height: 280px;
  display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px;
  box-shadow: 0 8px 0 var(--shadow); flex: 1;
}
.answers { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
.ans {
  min-width: 130px; min-height: 120px; padding: 8px 22px; border-radius: 28px;
  background: var(--yellow); box-shadow: 0 8px 0 #c99a00; font-size: 64px; font-weight: 800; line-height: 1;
}
.ans.letter, .ans.word { font-family: var(--read); font-weight: 700; }
.ans.pic { background: var(--paper); box-shadow: 0 8px 0 var(--shadow); font-size: 80px; min-width: 150px; min-height: 140px; }
.ans:active { transform: translateY(6px); box-shadow: 0 2px 0 #c99a00; }
.ans.wrong { background: #e6e9f0; box-shadow: 0 8px 0 #c3c9d6; color: #9aa4b8; animation: shake .4s; pointer-events: none; }
.ans.pic.wrong { opacity: .35; }
.ans.right { background: var(--green); color: #fff; box-shadow: 0 8px 0 #2a7d3e; animation: pop .4s; }
@keyframes shake { 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }
@keyframes pop { 50% { transform: scale(1.15); } }

/* counting */
.blocks { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; width: 100%; }
.block { display: grid; grid-template-columns: repeat(5, auto); gap: 6px; padding: 10px; border-radius: 20px; background: var(--sky); }
.block .mon { width: clamp(46px, 8vw, 84px); }
.mon { width: clamp(64px, 11vw, 104px); aspect-ratio: 1; max-width: 100%; position: relative; background: none; padding: 0; transition: transform .15s; }
.mon img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
.mon.counted img { filter: saturate(.3) opacity(.6); }
.mon b { position: absolute; inset: auto 0 -4px auto; background: var(--blue); color: #fff; border-radius: 999px; min-width: 36px; height: 36px; display: grid; place-items: center; font-size: 22px; }
/* sums */
.sum { display: flex; align-items: center; justify-content: center; gap: 14px 22px; flex-wrap: wrap; }
.group { display: grid; grid-template-columns: repeat(5, auto); gap: 6px; padding: 10px; border-radius: 18px; background: var(--sky); }
.group .ball { width: clamp(34px, 5.6vw, 52px); height: clamp(34px, 5.6vw, 52px); }
.group .ball.gone { opacity: .25; position: relative; }
.op { font-size: 72px; font-weight: 800; color: var(--blue); line-height: 1; }
.eq { font-size: clamp(54px, 9vw, 88px); font-weight: 800; width: 100%; text-align: center; line-height: 1; letter-spacing: 2px; }
.eq .q { color: var(--red); }
/* words */
.big-emoji { font-size: clamp(120px, 22vw, 200px); line-height: 1; }
.big-word { font-family: var(--read); font-weight: 700; font-size: clamp(90px, 16vw, 150px); line-height: 1; letter-spacing: 6px; color: var(--ink); background: none; padding: 0 12px; }
.big-word .first { color: var(--red); }
.big-word .g { display: inline-block; transition: transform .2s, color .2s; }
.big-word .g.lit { color: var(--blue); transform: translateY(-8px); }
.big-word.whole .g { color: var(--ink); transform: none; }
.big-word.whole .g.first { color: var(--red); }
.hint { width: 100%; text-align: center; color: var(--ink-soft); font-size: 18px; }

/* pokéball drawn in CSS */
.ball { display: inline-block; border-radius: 50%; position: relative; flex: none;
  background: linear-gradient(var(--red) 0 44%, var(--ink) 44% 56%, #fff 56%);
  box-shadow: inset 0 0 0 3px var(--ink); }
.ball::after { content: ""; position: absolute; inset: 34%; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px var(--ink); }

/* ---------- catch ---------- */
.catch { align-items: center; justify-content: center; text-align: center; }
.catch h2 { font-size: clamp(34px, 6vw, 56px); margin: 0; line-height: 1.05; text-wrap: balance; }
.catch .big { width: 140px; height: 140px; }
.catch .big.wobble { animation: wobble 1.8s ease-in-out; }
.catch img.new { width: min(300px, 70vw); max-width: 100%; animation: appear .6s cubic-bezier(.3,1.6,.5,1); }
@keyframes wobble { 0%,100% { transform: rotate(0); } 15% { transform: rotate(-22deg); } 30% { transform: rotate(18deg); } 45% { transform: rotate(-14deg); } 60% { transform: rotate(10deg); } 75% { transform: rotate(0); } }
@keyframes appear { from { transform: scale(0); } to { transform: scale(1); } }
.row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.go { background: var(--red); color: #fff; font-size: 30px; font-weight: 800; padding: 14px 30px; border-radius: 999px; box-shadow: 0 6px 0 #9c2408; }
.go.alt { background: var(--paper); color: var(--ink); box-shadow: 0 6px 0 var(--shadow); }
.go:active { transform: translateY(5px); box-shadow: 0 1px 0 #9c2408; }

/* ---------- pokédex ---------- */
.dex { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
.dex div { background: var(--paper); border-radius: 22px; padding: 10px 6px 8px; text-align: center; box-shadow: 0 4px 0 var(--shadow); }
.dex img { width: 100%; aspect-ratio: 1; max-width: 100%; object-fit: contain; }
.dex .no img { filter: brightness(0) opacity(.18); }
.dex span { display: block; font-weight: 700; font-size: 17px; line-height: 1.1; }
.dex .no span { color: transparent; }
.dex button { background: none; padding: 0; width: 100%; }

/* ---------- parents ---------- */
.ans.grid, .ans.bin, .ans.name { background: var(--paper); box-shadow: 0 8px 0 var(--shadow); }
.mini { display: grid; grid-template-columns: repeat(5, 30px); gap: 6px; padding: 8px; }
.mini i { width: 30px; height: 30px; border-radius: 50%; display: block; background: linear-gradient(var(--red) 0 44%, var(--ink) 44% 56%, #fff 56%); box-shadow: inset 0 0 0 2px var(--ink); }
.bignum { font-size: clamp(120px, 22vw, 200px); font-weight: 800; color: var(--blue); line-height: 1; }
.ans.bin { display: flex; flex-direction: column; align-items: stretch; min-width: 160px; padding: 0; overflow: hidden; border-radius: 28px; }
.binl { display: block; background: var(--red); font-family: var(--read); font-weight: 700; font-size: 60px; color: #fff; line-height: 1.25; border-bottom: 6px solid var(--ink); }
.binx { display: block; font-size: 64px; line-height: 1.2; padding-top: 6px; }
.bine { display: block; font-size: 24px; min-height: 34px; padding: 6px 8px; letter-spacing: 2px; }
.numline { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.numline span { min-width: 92px; padding: 14px 10px; border-radius: 20px; background: var(--sky); font-size: 56px; font-weight: 800; text-align: center; }
.numline .here { background: var(--yellow); }
.numline .gap { background: var(--paper); box-shadow: inset 0 0 0 4px var(--red); color: var(--red); }
.numline .gap.found { background: var(--green); color: #fff; box-shadow: none; }
.owners { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; width: 100%; }
.owner { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.owner img { width: clamp(80px, 13vw, 120px); }
.owner .group .ball, .share .ball { width: clamp(30px, 4.6vw, 42px); height: clamp(30px, 4.6vw, 42px); }
.owner .group.empty { min-width: 60px; min-height: 52px; }
.share { width: 100%; display: flex; justify-content: center; }
.ans.name { font-size: 34px; min-width: 200px; }
.question small { font-size: .55em; color: var(--ink-soft); font-weight: 700; }
.pin { display: flex; flex-direction: column; align-items: center; gap: 24px; padding-block: 12px; }
.pindots { display: flex; gap: 16px; }
.pindots i { width: 22px; height: 22px; border-radius: 50%; background: var(--paper); box-shadow: inset 0 0 0 3px var(--ink-soft); display: block; }
.pindots i.on { background: var(--ink); box-shadow: none; }
.pindots.nope { animation: shake .4s; }
.pad { display: grid; grid-template-columns: repeat(3, 84px); gap: 14px; }
.pad button { height: 84px; border-radius: 50%; background: var(--paper); font-size: 34px; font-weight: 700; box-shadow: 0 4px 0 var(--shadow); }
.pad button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }
.report { background: var(--paper); border-radius: 28px; padding: 20px; box-shadow: 0 8px 0 var(--shadow); display: flex; flex-direction: column; gap: 16px; -webkit-user-select: text; user-select: text; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--sky); border-radius: 18px; padding: 10px 14px; display: flex; flex-direction: column; }
.kpi span { font-size: 15px; color: var(--ink-soft); }
.kpi b { font-size: 26px; line-height: 1.1; }
.kpi small { font-size: 14px; color: var(--ink-soft); }
.tablewrap { overflow-x: auto; }
.report table { border-collapse: collapse; width: 100%; font-size: 17px; font-variant-numeric: tabular-nums; }
.report th { text-align: left; font-size: 14px; color: var(--ink-soft); font-weight: 700; padding: 6px 10px; border-bottom: 2px solid var(--sky-deep); white-space: nowrap; }
.report td { padding: 6px 10px; border-bottom: 1px solid var(--sky); vertical-align: top; white-space: nowrap; }
.report td small { color: var(--ink-soft); }
.report h3 { margin: 0; font-size: 22px; }
.settings { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; }
.settings label { display: flex; flex-direction: column; gap: 4px; font-weight: 700; font-size: 15px; color: var(--ink-soft); min-width: 0; }
.chip.danger { background: var(--red); color: #fff; }
#wipe .chip { font-size: 16px; }
.voice select { font: inherit; font-size: 18px; padding: 10px 12px; border-radius: 14px; border: 2px solid var(--sky-deep); background: var(--paper); color: var(--ink); max-width: 100%; min-width: 0; }
.tag { display: inline-block; border-radius: 999px; padding: 2px 10px; font-weight: 700; font-size: 15px; }
.tag-easy { background: #d8f2dd; color: #1f6b33; }
.tag-hard { background: #ffe9b8; color: #7a5200; }
.tag-try { background: var(--sky); color: var(--ink-soft); }
.misses { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px 16px; font-size: 17px; }
.misses span { color: var(--ink-soft); font-size: 14px; display: inline-block; min-width: 82px; }

@media (max-width: 520px) {
  .ans { min-width: 92px; min-height: 92px; font-size: 48px; }
  .ans.pic { min-width: 100px; min-height: 100px; font-size: 58px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<main id="app"></main>

<script>
(() => {
  const IMG = 'img/';
  const POKE = [
    [25,'Pikachu'],[1,'Bulbasaur'],[4,'Charmander'],[7,'Squirtle'],[133,'Eevee'],[39,'Jigglypuff'],
    [54,'Psyduck'],[52,'Meowth'],[143,'Snorlax'],[175,'Togepi'],[172,'Pichu'],[129,'Magikarp'],
    [132,'Ditto'],[79,'Slowpoke'],[37,'Vulpix'],[94,'Gengar'],[6,'Charizard'],[149,'Dragonite'],
    [151,'Mew'],[152,'Chikorita'],[155,'Cyndaquil'],[158,'Totodile'],[252,'Treecko'],[255,'Torchic'],
    [258,'Mudkip'],[393,'Piplup'],[448,'Lucario'],[722,'Rowlet'],[725,'Litten'],[728,'Popplio'],
    [906,'Sprigatito'],[909,'Fuecoco'],[912,'Quaxly'],[196,'Espeon'],[197,'Umbreon'],[470,'Leafeon'],
    [471,'Glaceon'],[700,'Sylveon']
  ];
  const nameOf = id => (POKE.find(p => p[0] === id) || [0, 'Pokémon'])[1];

  // Short, sound-pure Dutch words with a clear picture, split into graphemes (sounds).
  // Level 1: three sounds with a short vowel (kat, vis). Level 2: long vowels, two-letter sounds and four-sound words.
  const WORDS = [
    ['vis','🐟','v-i-s'],['kat','🐱','k-a-t'],['bus','🚌','b-u-s'],['pen','🖊️','p-e-n'],['pet','🧢','p-e-t'],
    ['bal','⚽','b-a-l'],['lam','🐑','l-a-m'],['lip','👄','l-i-p'],['bel','🔔','b-e-l'],['zon','☀️','z-o-n'],
    ['pan','🍳','p-a-n'],['tas','👜','t-a-s'],['bok','🐐','b-o-k'],['bot','🦴','b-o-t'],['net','🥅','n-e-t'],
    ['kip','🐔','k-i-p'],['sok','🧦','s-o-k'],['rok','👗','r-o-k'],['jas','🧥','j-a-s'],['vos','🦊','v-o-s'],
    ['kok','🧑‍🍳','k-o-k'],['man','👨','m-a-n'],['kus','💋','k-u-s'],['hut','🛖','h-u-t'],['wol','🧶','w-o-l'],
    ['pil','💊','p-i-l'],['sap','🧃','s-a-p'],
    ['maan','🌙','m-aa-n',2],['raam','🪟','r-aa-m',2],['boom','🌳','b-oo-m',2],['boot','⛵','b-oo-t',2],
    ['boek','📖','b-oe-k',2],['koe','🐮','k-oe',2],['roos','🌹','r-oo-s',2],['muis','🐭','m-ui-s',2],
    ['vuur','🔥','v-uu-r',2],['kaas','🧀','k-aa-s',2],['been','🦵','b-ee-n',2],['neus','👃','n-eu-s',2],
    ['voet','🦶','v-oe-t',2],['uil','🦉','ui-l',2],['duim','👍','d-ui-m',2],['ster','⭐','s-t-e-r',2],
    ['lamp','💡','l-a-m-p',2],['slak','🐌','s-l-a-k',2],['melk','🥛','m-e-l-k',2],['palm','🌴','p-a-l-m',2],
    ['tent','⛺','t-e-n-t',2],['wolk','☁️','w-o-l-k',2],['vork','🍴','v-o-r-k',2],['zeep','🧼','z-ee-p',2],
    ['haan','🐓','h-aa-n',2],['beer','🐻','b-ee-r',2],['peer','🍐','p-ee-r',2],['kerk','⛪','k-e-r-k',2],
    ['loep','🔍','l-oe-p',2],['ijs','🍦','ij-s',2],['ei','🥚','ei',2],
    ['zak','🛍️','z-a-k'],['fles','🍾','f-l-e-s',2],['fee','🧚','f-ee',2],['feest','🎉','f-ee-s-t',2],
    ['fiets','🚲','f-ie-t-s',2],['tram','🚋','t-r-a-m',2],['taart','🎂','t-aa-r-t',2]
  ].map(([w, e, g, lvl = 1]) => ({ w, e, g: g.split('-'), lvl }));
  const wordsFor = lvl => WORDS.filter(x => x.lvl <= lvl);
  const LETTERS = { 1: 'mnrvszbptkljhwf'.split(''), 2: 'mnrvszbptkljhwfd'.split('') };
  // end-sound questions only use words that end in a single consonant (vis → s)
  // pictures a child could easily name differently (lam/schaap, zak/tas): kept out of sorting
  const UNCLEAR = ['lam', 'zak', 'pan', 'net', 'kus', 'lip', 'bot', 'been', 'wol', 'hut', 'palm', 'raam', 'kok', 'loep', 'tas', 'rok', 'pen'];
  const endsWithConsonant = x => LETTERS[2].includes(x.g[x.g.length - 1]);
  // first-sound game only uses words that start with a single consonant
  const startsWithConsonant = x => x.g[0].length === 1 && LETTERS[2].includes(x.g[0]);
  const zoem = x => x.g.map(k => 'klank:' + k);
  const wordHTML = (x, firstRed) => x.g.map((g, i) => `<span class="g${firstRed && i === 0 ? ' first' : ''}">${g}</span>`).join('');
  // zoemen made visible: light up each sound in turn, then the whole word
  const zoemShow = (el) => {
    const gs = [...el.querySelectorAll('.g')];
    el.classList.remove('whole'); gs.forEach(g => g.classList.remove('lit'));
    gs.forEach((g, i) => setTimeout(() => g.classList.add('lit'), 150 + i * 550));
    setTimeout(() => el.classList.add('whole'), 300 + gs.length * 550);
  };

  // ---------- storage ----------
  const KEY = 'thiago-pokewereld-v1';
  const fresh = () => ({ v: 2, caught: [25], lvl: { tel: 1, som: 1, hoeveel: 1, buren: 1, meer: 1, klank: 1, sorteer: 1, lees: 1 }, mute: false, focus: 'l', voiceName: '' });
  let S = fresh();
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const old = JSON.parse(raw);
      S = Object.assign(fresh(), old);
      S.lvl = Object.assign(fresh().lvl, old.lvl || {});

  } catch (e) {}
  // Progress also goes to the artifact's shared store (when signed in on claude.ai), so a parent can check it from any device.
  let db = null;
  let saveTimer = null;
  const save = () => {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    if (!db) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => db.doc('progress/state').set({ caught: S.caught, lvl: S.lvl, updated: Date.now() }).catch(() => {}), 400);
  };
  const today = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const dayCache = {};
  let logChain = Promise.resolve();
  // one document per day per game: totals plus the last few mistakes
  // the same day-per-game record is also kept on the device itself (S.log), so the parent page works on GitHub Pages
  let lastAnswerAt = 0;
  const localDay = key => {
    S.log = S.log || {};

  };
  const logLocal = (key, ok, firstTry, item, picked) => {
    const d = localDay(key);

    if (lastAnswerAt) d.secs = (d.secs || 0) + Math.min(60, Math.round((now - lastAnswerAt) / 1000));

  const logAnswer = (key, ok, firstTry, item, picked) => {
    logLocal(key, ok, firstTry, item, picked);
    if (!db) return;
    logChain = logChain.then(async () => {
      const id = `${today()}_${key}`;
      const ref = db.collection('days').doc(id);
      if (!dayCache[id]) {
        const snap = await ref.get().catch(() => null);
        dayCache[id] = (snap && snap.exists && { ...snap.data(), misses: [...(snap.data().misses || [])] }) || { date: today(), game: key, answered: 0, firstTry: 0, wrong: 0, catches: 0, misses: [] };
      }
      const d = dayCache[id];
      if (ok) { d.answered++; if (firstTry) d.firstTry++; }

  if (S.voiceName === 'builtin') loadClips();
  const unlock = () => {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();

  const b64buf = b64 => { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; };
  const getBuf = key => decoded[key] || (decoded[key] = new Promise((res, rej) => actx.decodeAudioData(b64buf(clips[key]), res, rej)));
  const stopAll = () => { playToken++; try { playing && playing.stop(); } catch (e) {} playing = null; if (window.speechSynthesis) speechSynthesis.cancel(); };

  let voice = null;

  const dutchVoices = () => allVoices().filter(v => /^nl([-_]|$)/i.test(v.lang || ''));
  const pickVoice = () => {

         || vs.find(v => /nl[-_]NL/i.test(v.lang) && /(Premium|Enhanced|Verbeterd)/i.test(v.name))
         || vs.find(v => /nl[-_]NL/i.test(v.lang) && /(Xander|Claire|Ellen|Google)/i.test(v.name))
         || vs.find(v => /nl[-_]NL/i.test(v.lang)) || vs[0] || null;

  const SOUND = {

    Jigglypuff: 'Djiggeliepuf', Psyduck: 'Saaiduk', Meowth: 'Mie-ouf', Snorlax: 'Snorlaks', Togepi: 'Toogeepie',
    Pichu: 'Pietsjoe', Magikarp: 'Medjiekarp', Ditto: 'Dittoo', Slowpoke: 'Sloopook', Vulpix: 'Vulpiks',
    Gengar: 'Genggar', Charizard: 'Tsjarriezard', Dragonite: 'Dreggonaait', Mew: 'Mjoe', Chikorita: 'Tsjiekoorieta',
    Cyndaquil: 'Sindakwil', Totodile: 'Tootoodaail', Treecko: 'Triekoo', Torchic: 'Tortsjik', Mudkip: 'Mudkip',
    Piplup: 'Piplup', Lucario: 'Loekaarioo', Rowlet: 'Roolet', Litten: 'Litten', Popplio: 'Popplieoo',
    Sprigatito: 'Spriegatietoo', Fuecoco: 'Foeweekookoo', Quaxly: 'Kweksli', Espeon: 'Espiejon', Umbreon: 'Umbriejon',

  const SOUND_RE = new RegExp(`(${Object.keys(SOUND).join('|')})`, 'g');

  // ---------- helpers ----------
  const $ = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const app = document.getElementById('app');

    for (const x of near) { if (set.size >= count) break; set.add(x); }

  // ---------- games ----------
  const GAMES = {

    som: {
      title: 'Sommen', sub: 'Plus en min met Pokéballen', art: '2 + 3', peek: 4, maxLvl: 7,

          answer: f, choices: r.letters, kind: 'bin',
          labels: Object.fromEntries(r.letters.map(l => [l,
            `<span class="binl">${l}</span><span class="binx">${r.examples[l].e}</span><span class="bine">${r.bins[l].slice(-5).join('')}</span>`])),
          render(stage) {
            stage.innerHTML = '';
            const pic = $(`<button class="big-emoji" style="background:none" aria-label="${x.w}">${x.e}</button>`);
            pic.onclick = () => say(x.w);
            stage.append(pic);
            stage.append($(`<div class="hint">Zeg het woord. In welke Pokébal past het: ${same} het net zo?</div>`));
          },
          reveal(stage) {
            r.bins[f].push(x.e);
            const w = $(`<div class="big-word">${x.g.map((g, i) => `<span class="g${(r.end ? i === x.g.length - 1 : i === 0) ? ' first' : ''}">${g}</span>`).join('')}</div>`);
            stage.querySelector('.hint').replaceWith(w); zoemShow(w);
          },
          after: [x.w, r.examples[f].w], item: `${x.w} (sorteren ${r.end ? 'eind' : 'begin'})`
        };
      }
    },
    lees: {
      title: 'Woordjes lezen', sub: 'Lees het woord, kies het plaatje', art: 'vis', peek: 54, maxLvl: 2,
      levelText: ['korte woorden', 'langere woorden'],
      make(lvl) {
        let pool = WORDS.filter(x => x.lvl === lvl);
        const focusWords = pool.filter(x => S.focus && x.w.includes(S.focus));
        if (focusWords.length && Math.random() < .4) pool = focusWords;
        const x = pick(pool);
        // pictures that start with the same letter (then: same end letter), so the first letter alone is not enough
        const rest = WORDS.filter(o => o.w !== x.w && o.e !== x.e);
        const sameStart = shuffle(rest.filter(o => o.w[0] === x.w[0]));
        const sameEnd = shuffle(rest.filter(o => o.w[0] !== x.w[0] && o.w.slice(-1) === x.w.slice(-1)));
        const others = [...sameStart, ...sameEnd, ...shuffle(rest)].filter((o, i, all) => all.indexOf(o) === i).slice(0, 2);
        const choices = shuffle([x, ...others]);
        return {
          q: 'Welk plaatje hoort bij dit woord?', spoken: ['Lees het woord. Welk plaatje hoort erbij?'],
          answer: x.w, choices: choices.map(c => c.w), labels: Object.fromEntries(choices.map(c => [c.w, c.e])), kind: 'pic',
          render(stage) {
            stage.innerHTML = '';
            const w = $(`<button class="big-word" aria-label="woord">${wordHTML(x)}</button>`);
            w.onclick = () => { zoemShow(w); say(...zoem(x), x.w); };
            stage.append(w);
            stage.append($(`<div class="hint">Lukt het niet? Tik op het woord en zoem mee.</div>`));
          },
          // after a wrong pick, sing the sounds so he can blend along
          onWrong(stage) { setTimeout(() => { zoemShow(stage.querySelector('.big-word')); say(...zoem(x), x.w); }, 900); },
          reveal(stage) { zoemShow(stage.querySelector('.big-word')); },
          after: [...zoem(x), x.w], item: `lees ${x.w}`
        };
      }
    }
  };

  function game(key) {
    const g = GAMES[key];
    let stars = 0, streak = 0, misses = 0;
    const el = $(`<section class="screen">
      <div class="bar">
        <button class="round" id="back" aria-label="terug">🏠</button>
        <div class="stars">${Array.from({ length: BALLS }, () => ballHTML()).join('')}</div>

      <div class="stage" id="stage"></div>
      <div class="answers" id="answers"></div>
    </section>`);
    const stage = el.querySelector('#stage'), answers = el.querySelector('#answers');
    const lvlBtn = el.querySelector('#lvl');
    const paintLvl = () => { lvlBtn.innerHTML = `${dotsHTML(S.lvl[key], g.maxLvl)} ${g.levelText[S.lvl[key] - 1]}`; };
    el.querySelector('#back').onclick = () => show(home());
    let cur;
    el.querySelector('#again').onclick = () => cur && say(...cur.spoken);

    function next() {
      misses = 0;
      // a question only comes back after about 8 others
      const recent = RECENT[key] || (RECENT[key] = []);
      for (let i = 0; i < 40; i++) { cur = g.make(S.lvl[key]); if (!recent.includes(cur.item)) break; }
      recent.push(cur.item); if (recent.length > 8) recent.shift();
      el.querySelector('#q').innerHTML = cur.q;
      cur.render(stage);
      answers.innerHTML = '';
      for (const c of cur.choices) {
        const label = cur.labels ? cur.labels[c] : c;
        const b = $(`<button class="ans ${cur.kind || ''}">${label}</button>`);
        b.onclick = () => choose(b, c);
        answers.append(b);
      }
      setTimeout(() => say(...cur.spoken), 250);
    }
    function choose(btn, c) {
      if (c === cur.answer) {
        btn.classList.add('right');
        answers.querySelectorAll('button').forEach(b => b.disabled = true);
        if (cur.reveal) cur.reveal(stage);
        logAnswer(key, true, misses === 0, cur.item, c);
        if (misses === 0) streak++; else streak = 0;
        // adaptive level: 4 first-try answers in a row moves up
        if (streak >= 4 && S.lvl[key] < g.maxLvl) { S.lvl[key]++; streak = 0; save(); paintLvl(); }
        stars++;
        el.querySelectorAll('.stars .ball')[stars - 1].classList.add('on');
        const shown = Date.now();
        say(pick(PRAISE), PAUSE, ...cur.after).then(() => setTimeout(() => {
          if (!el.isConnected) return;
          stars >= BALLS ? show(catchScreen(key)) : next();
        }, Math.max(600, 2200 - (Date.now() - shown))));
      } else {
        btn.classList.add('wrong');
        logAnswer(key, false, false, cur.item, cur.labels && !String(cur.labels[c]).includes('<') ? cur.labels[c] : c);
        misses++; streak = 0;
        if (misses >= 2 && S.lvl[key] > 1) { S.lvl[key]--; save(); paintLvl(); }
        say('Bijna! Probeer het nog eens.');
        if (cur.onWrong) cur.onWrong(stage);
      }
    }
    paintLvl();
    if (g.start) g.start(S.lvl[key]);
    setTimeout(next, 0);
    return el;
  }

  function parents() {
    const el = $(`<section class="screen">
      <div class="bar">
        <button class="round" id="back" aria-label="terug">🏠</button>
        <h2 class="question" style="flex:1;justify-content:flex-start">Voortgang van Thiago</h2>
      </div>
      <div class="report" id="report"><p class="parent">Laden…</p></div>
    </section>`);
    el.querySelector('#back').onclick = () => show(home());
    const box = el.querySelector('#report');
    el.querySelector('.bar').after(settingsPanel(() => show(parents())));
    const lvlLine = Object.entries(GAMES).map(([k, g]) => `<div class="kpi"><span>${g.title}</span><b>niveau ${S.lvl[k]}</b><small>${g.levelText[S.lvl[k] - 1]}</small></div>`).join('');
    const head = `<div class="kpis">${lvlLine}<div class="kpi"><span>Pokédex</span><b>${S.caught.length} / ${POKE.length}</b><small>gevangen</small></div></div>`;
    const render = rows => {
      if (!rows.length) { box.innerHTML = head + `<p class="parent">Nog geen oefeningen gedaan. Na de eerste antwoorden verschijnt hier per dag wat Thiago heeft gedaan.</p>`; return; }
      rows = rows.slice().sort((a, b) => b.date.localeCompare(a.date));
      const fmt = ds => new Date(ds + 'T12:00').toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' });
      const daysAgo = n => today(new Date(Date.now() - n * 864e5));
      const mins = secs => Math.max(1, Math.round((secs || 0) / 60));
      // the learning notes ask for makkelijk / nog lastig rather than bare scores
      const feelOf = (answered, firstTry) => answered < 3 ? ['even geprobeerd', 'tag-try'] : firstTry / answered >= .75 ? ['makkelijk', 'tag-easy'] : ['nog lastig', 'tag-hard'];
      const week = rows.filter(r => r.date >= daysAgo(6)), prev = rows.filter(r => r.date < daysAgo(6) && r.date >= daysAgo(13));
      const sum = (list, f) => list.reduce((t, r) => t + (r[f] || 0), 0);
      const playDays = new Set(week.map(r => r.date)).size;

      let html = head + `<div class="kpis">
        <div class="kpi"><span>Deze week</span><b>${playDays} ${playDays === 1 ? 'dag' : 'dagen'}</b><small>gespeeld</small></div>
        <div class="kpi"><span>Speeltijd deze week</span><b>${week.some(r => r.secs) ? mins(sum(week, 'secs')) + ' min' : '–'}</b><small>ongeveer</small></div>
        <div class="kpi"><span>Vragen deze week</span><b>${sum(week, 'answered')}</b><small>${sum(week, 'answered') ? Math.round(100 * sum(week, 'firstTry') / sum(week, 'answered')) + '% in 1x goed' : ''}</small></div>
        <div class="kpi"><span>Gevangen deze week</span><b>${sum(week, 'catches')}</b><small>Pokémon</small></div>
      </div>`;

      // per game: this week against the week before
      html += `<h3>Per spel, deze week</h3><div class="tablewrap"><table><thead><tr><th>Spel</th><th>Hoe ging het</th><th>Vragen</th><th>In 1x goed</th><th>Vorige week</th><th>Niveau nu</th></tr></thead><tbody>`;
      for (const [k, g] of Object.entries(GAMES)) {
        const w = week.filter(r => r.game === k), pv = prev.filter(r => r.game === k);
        const a = sum(w, 'answered'), f = sum(w, 'firstTry'), pa = sum(pv, 'answered'), pf = sum(pv, 'firstTry');
        const feel = feelOf(a, f);
        const pct = a ? Math.round(100 * f / a) : null, ppct = pa ? Math.round(100 * pf / pa) : null;
        const trend = pct === null || ppct === null ? '' : pct > ppct + 4 ? ' ▲' : pct < ppct - 4 ? ' ▼' : ' =';
        html += `<tr><td>${g.title}</td><td>${a ? `<span class="tag ${feel[1]}">${feel[0]}</span>` : '<small>niet gespeeld</small>'}</td><td>${a}</td><td>${pct === null ? '' : pct + '%' + trend}</td><td>${ppct === null ? '' : ppct + '%'}</td><td>${g.levelText[S.lvl[k] - 1]}</td></tr>`;
      }
      html += `</tbody></table></div>`;

      // what keeps going wrong: count the same question over the last two weeks
      const counts = {};
      rows.filter(r => r.date >= daysAgo(13)).forEach(r => (r.misses || []).forEach(m => {
        const [q, picked] = m.split(' → ');
        const c = counts[q] || (counts[q] = { n: 0, picked: [] });
        c.n++; if (picked && !c.picked.includes(picked)) c.picked.push(picked);
      }));
      const hard = Object.entries(counts).sort((a, b) => b[1].n - a[1].n).slice(0, 12);
      if (hard.length) html += `<h3>Nog lastig (laatste 2 weken)</h3><ul class="misses">${hard.map(([q, c]) => `<li><b>${q}</b> <span>${c.n}× fout · koos ${c.picked.slice(0, 3).join(', ')}</span></li>`).join('')}</ul><p class="parent">Handig om samen nog eens te oefenen: eerst voordoen, dan samen.</p>`;

      // day by day
      const byDate = {};
      rows.forEach(r => (byDate[r.date] = byDate[r.date] || []).push(r));
      html += `<h3>Per dag</h3><div class="tablewrap"><table><thead><tr><th>Dag</th><th>Spel</th><th>Hoe ging het</th><th>Vragen</th><th>In 1x goed</th><th>Fout</th><th>Tijd</th><th>Niveau</th><th>Gevangen</th></tr></thead><tbody>`;
      for (const [date, list] of Object.entries(byDate).slice(0, 21)) {
        list.forEach((r, i) => {
          const share = r.answered ? r.firstTry / r.answered : 0;
          const feel = feelOf(r.answered, r.firstTry);
          html += `<tr>${i === 0 ? `<td rowspan="${list.length}">${fmt(date)}</td>` : ''}<td>${(GAMES[r.game] || { title: r.game }).title}</td><td><span class="tag ${feel[1]}">${feel[0]}</span></td><td>${r.answered}</td><td>${r.firstTry} <small>(${Math.round(100 * share)}%)</small></td><td>${r.wrong}</td><td>${r.secs ? mins(r.secs) + ' min' : ''}</td><td>${r.level ? (GAMES[r.game] ? GAMES[r.game].levelText[r.level - 1] : r.level) : ''}</td><td>${r.catches || 0}</td></tr>`;
        });
      }
      html += `</tbody></table></div>`;
      box.innerHTML = html;
    };
    const local = Object.values(S.log || {});
    if (!db) { render(local); return el; }
    db.collection('days').orderBy('date', 'desc').limit(120).get()
      .then(q => { const rows = q.docs.map(d => d.data()); render(rows.length ? rows : local); })
      .catch(() => render(local));
    return el;
  }

  function show(el) { app.innerHTML = ''; app.append(el); window.scrollTo(0, 0); }
  show(home());

  (async () => {
    if (!window.claude || !window.claude.use) return;
    try {
      const d = await window.claude.use('db');
      if (!d) return;
      const snap = await d.doc('progress/state').get();
      if (snap.exists) {
        const r = snap.data();
        S.caught = [...new Set([...(r.caught || []), ...S.caught])];
        S.lvl = Object.assign({}, S.lvl, r.lvl || {});
      }
      db = d;
      save();
      if (app.querySelector('.hello')) show(home());
    } catch (e) {}
  })();
})();
</script>
